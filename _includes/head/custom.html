<style>
/* ========= 1) Sidebar avatar: scale down on phones ========= */
:root{
  --avatar-size: 260px;    /* desktop/tablet max */
}
.page .sidebar .author__avatar{
  width: min(var(--avatar-size), 100%) !important;
  aspect-ratio: 1 / 1;
  border-radius: 50% !important;
  overflow: hidden;
  margin: 0 auto 1rem !important;
}
.page .sidebar .author__avatar img{
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  display: block !important;
}
@media (max-width: 680px){
  :root{ --avatar-size: 160px; }   /* smaller on phones to avoid clipping */
}

/* ========= 2) Content images: responsive + unfloated on phones ========= */
.page .page__content img{
  max-width: 100% !important;
  height: auto !important;
}
@media (max-width: 768px){
  .page .page__content img,
  .page .page__content .align-right,
  .page .page__content .align-left{
    float: none !important;
    display: block !important;
    margin: 0 auto 1rem !important;
  }
  /* Kill fixed inline widths on phones */
  .page .page__content img[style*="max-width"],
  .page .page__content img[width]{
    max-width: 100% !important;
    width: 100% !important;
    height: auto !important;
  }
}

/* ========= 3) Hero banners you added: shrink height on phones ========= */
.hero-block{
  position: relative;
  min-height: 280px;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.hero-bg{
  position: absolute; inset: 0;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  filter: brightness(0.85);
}
.hero-inner{
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  min-height: 280px;
}
@media (max-width: 680px){
  .hero-block{ min-height: 180px; }
  .hero-inner{ min-height: 180px; }
}

/* ========= 4) Tables/iframes/PDFs: prevent sideways scrolling ========= */
.page .page__content table{
  display: block; overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.page .page__content iframe,
.page .page__content object,
.page .page__content embed{
  max-width: 100% !important; width: 100% !important; height: auto;
  aspect-ratio: 16/9;            /* keeps videos readable on phones */
}

/* ========= 5) Optional: only widen sidebar on large screens ========= */
@media (min-width: 900px){
  .sidebar, .sidebar.sticky { max-width: 340px !important; }
}
</style>
<style>
.page .page__content h2{ margin-top:1.25rem; }
.page .page__content ul{ list-style: none; padding-left: 0; }
.page .page__content ul li{
  padding:.5rem .75rem; margin:.15rem 0;
  border:1px solid rgba(0,0,0,.06); border-radius:10px;
  background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.03);
}
.page .page__content ul li em{ color:#555; }
@media (prefers-color-scheme: dark){
  .page .page__content ul li{ background:#111; border-color:#222; }
  .page .page__content ul li em{ color:#bbb; }
}
</style>
