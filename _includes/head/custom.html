<style>
/* ===== Avatar size (desktop/tablet/phone) ===== */
:root{
  --avatar-size: 450px;    /* desktop max */
  --avatar-size-md: 300px; /* medium screens */
  --avatar-size-sm: 180px; /* phones */
}

/* Only widen the sidebar on wider screens (prevents mobile overflow) */
@media (min-width: 900px){
  .sidebar, .sidebar.sticky { max-width: 340px !important; }
}

/* Bulletproof avatar */
.page .sidebar .author__avatar{
  width: min(var(--avatar-size), 100%) !important;
  aspect-ratio: 1 / 1;
  border-radius: 50% !important;
  overflow: hidden;
  margin: 0 auto 1rem !important;
  padding: 0 !important;
  box-sizing: border-box;
}
.page .sidebar .author__avatar img{
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  object-fit: cover !important;    /* full-bleed, no distortion */
  object-position: 50% 45% !important;
  display: block !important;
  border-radius: 0 !important;
}

/* Scale avatar down at narrower widths */
@media (max-width: 1200px){ :root{ --avatar-size: var(--avatar-size-md); } }
@media (max-width: 680px){  :root{ --avatar-size: var(--avatar-size-sm); } }

/* ===== Make content images responsive ===== */
/* Always allow images in page content to shrink to container */
.page .page__content img{
  max-width: 100% !important;
  height: auto !important;
}

/* On phones/tablets, kill floats (from inline style or classes) and center images */
@media (max-width: 768px){
  .page .page__content img,
  .page .page__content .align-right,
  .page .page__content .align-left {
    float: none !important;
    display: block !important;
    margin: 0 auto 1rem !important;
  }
  /* If you used inline max-widths, let them expand to full width on small screens */
  .page .page__content img[style*="max-width"]{
    max-width: 100% !important;
  }
}

/* Optional: make embedded PDFs/iframes responsive */
.page .page__content iframe,
.page .page__content object{
  max-width: 100% !important;
  width: 100% !important;
}
</style>
